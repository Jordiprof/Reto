name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src tests

      - name: Test with pytest
        # "python -m pytest" (NO "pytest" a secas): con -m, Python añade la
        # raiz del proyecto a donde busca modulos, y "from src... import"
        # funciona. Sin -m, pytest usa tests/ como raiz (no tiene
        # __init__.py) y "src" no se encuentra - bug real, reproducido
        # el 25/07 en un worktree limpio: mismo fallo exacto que en el CI.
        run: python -m pytest -q

      - name: Audit dependencies
        run: pip install pip-audit && pip-audit -r requirements.txt
        continue-on-error: true